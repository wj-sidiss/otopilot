name: testler

on:
  push:
  pull_request:

# en az yetki: is akisi depoya yazamaz, sir okumaz (testler gercek anahtar kullanmaz)
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # ffmpeg kurulamazsa ffmpeg gerektiren testler kendiliginden "skip" olur (hata vermez)
      # ucuncu taraf eylem: hareketli etiket (v3) yerine degismez commit ozetine sabitlendi (tedarik zinciri)
      - uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        continue-on-error: true
      # --ignore-scripts: bagimliliklarin kurulum betikleri (msedge-tts "preinstall: npx only-allow pnpm" uzaktan paket indirip calistirir) kosmaz
      - run: npm ci --no-fund --ignore-scripts
      # `npm test` = panel + video-indirici + ai-infapp testleri (test/, video-indirici/test/, ai-infapp/test/; yt-dlp yoksa ilgili test atlanir)
      - run: npm test
        env:
          # testler gercek .env'e ve ucretli servislere dokunmaz; ag cagrilari sahtelenir
          PANEL_ANAHTAR_TEST_KAPALI: "1"
