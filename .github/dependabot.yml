# Bagimlilik ve CI eylemi guncellemeleri haftalik PR olarak gelir; hicbiri kendiliginden birlesmez (main korumali, sahip onayi gerekir).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [bagimlilik]
    commit-message: { prefix: "bagimlilik" }
    groups:
      gelistirme-ve-yama:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [bagimlilik]
    commit-message: { prefix: "ci" }
