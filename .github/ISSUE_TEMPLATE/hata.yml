name: "Hata bildirimi / Bug report"
description: "Bir şey beklediğin gibi çalışmıyor / Something does not work as expected"
title: "[Hata] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **TR:** Otopilot bir hizmet değil, kendi bilgisayarında çalıştırdığın bir araçtır. Burada video sipariş edilmez; yalnızca aracın hatası bildirilir. Önce `npm run guncelle` ile son sürüme geç. API anahtarını, `.env` içeriğini ya da kişisel verini yapıştırma.

        **EN:** Otopilot is not a service; it is a tool you run on your own computer. Videos are not ordered here, only bugs in the tool are reported. Update first with `npm run guncelle`. Do not paste API keys, `.env` contents or personal data.
  - type: textarea
    id: yapilan
    attributes:
      label: "Ne yaptın? / What did you do?"
      description: "Çalıştırdığın komutlar ya da adımlar, ajana yazdığın istek / Commands or steps you ran, the request you gave the agent"
      placeholder: "node video-yap.js ornek-is"
    validations:
      required: true
  - type: textarea
    id: beklenen
    attributes:
      label: "Ne bekliyordun? / What did you expect?"
    validations:
      required: true
  - type: textarea
    id: olan
    attributes:
      label: "Ne oldu? / What happened?"
    validations:
      required: true
  - type: dropdown
    id: ajan
    attributes:
      label: "Hangi ajanla çalıştırdın? / Which agent did you use?"
      options:
        - Claude Code
        - Codex
        - "Diğer ajan / Other agent"
        - "Ajan yok, komutları kendim çalıştırdım / No agent, I ran the commands myself"
    validations:
      required: true
  - type: dropdown
    id: isletim-sistemi
    attributes:
      label: "İşletim sistemi / Operating system"
      options:
        - Windows
        - macOS
        - Linux
        - "Diğer / Other"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: "Node.js sürümü / Node.js version (node -v)"
      placeholder: "v22.12.0"
    validations:
      required: true
  - type: input
    id: surum
    attributes:
      label: "Otopilot sürümü / Otopilot version"
      description: "npm run guncelle çıktısındaki sürüm ya da package.json içindeki version / The version printed by npm run guncelle or in package.json"
      placeholder: "1.2.0"
  - type: textarea
    id: hata-mesaji
    attributes:
      label: "Hata mesajı ve çıkış kodu (varsa) / Error message and exit code (if any)"
      description: "Terminaldeki ✗ satırını ve çıkış kodunu (2, 3, 4, 5, 6, 7 ...) olduğu gibi yapıştır / Paste the ✗ line and the exit code as printed"
      render: text
  - type: checkboxes
    id: kontrol
    attributes:
      label: "Kontrol / Checklist"
      options:
        - label: "Son sürümde denedim (npm run guncelle ya da yeni ZIP) / I tried the latest version (npm run guncelle or a fresh ZIP)"
          required: true
        - label: "Yapıştırdıklarımda API anahtarı ya da kişisel veri yok / What I pasted contains no API keys or personal data"
          required: true
