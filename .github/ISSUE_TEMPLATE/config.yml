contact_links:
  - name: "Video siparişi değil / Not a video ordering service"
    url: https://github.com/wj-sidiss/otopilot#readme
    about: "TR: Otopilot, kendi bilgisayarında çalıştırdığın açık kaynak bir araçtır; burada video yapılmaz, sipariş alınmaz. Kendi videonu üretmek için README'deki kurulumu izle ve depoyu Claude Code ya da Codex'e ver. EN: Otopilot is an open-source tool you run on your own computer. Videos are not made or ordered here. To make your own video, follow the README setup and give the repo to Claude Code or Codex."
